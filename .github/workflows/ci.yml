name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      # Every committed artefact is regenerated and compared. A hand-edit to
      # dist/tokens.css turns the build red rather than surviving until someone
      # next runs the build.
      - name: Tokens are in sync
        run: npm run tokens:check

      # Framework leakage, prop vocabulary, and any component that ships
      # against an unfinished contract.
      - name: Contracts are valid
        run: npm run spec:validate

      # Eight value classes across 45 stylesheets. A literal fails here.
      - name: No token drift
        run: npm run audit:drift && git diff --exit-code DRIFT-REPORT.md

      # The published site's conformance and drift pages are generated from
      # the audits, so they cannot claim numbers the build does not produce.
      - name: Published reports match the build
        run: npm run docs:check

      # Two projects. `unit`: the contrast gate across both themes and the
      # contract-driven keyboard and anatomy suites, in jsdom. `storybook`: every
      # story rendered in headless Chromium through the Vitest addon, with the
      # a11y addon composed in — an axe violation fails here.
      - name: Browser for the story tests
        run: npx playwright install --with-deps chromium
      - run: npm test

      - run: npm run build
      - run: npm run build-storybook

      # The built site, not the source: the test runner serves storybook-static
      # and renders every story from its index.json, so a story that only works
      # on the dev server cannot merge. (deploy.yml is a separate workflow on
      # main; this check gates the merge, not the deploy.) (axe already ran above; a test-runner config file would
      # let it run here too, but Storybook 10 loads that file through module
      # hooks Jest refuses, so this pass stays configuration-free.)
      - name: Built Storybook renders every story
        run: npm run test:storybook:ci

  # Separate job: a scaffolded doc failing should not stop the site deploying,
  # but it should be visible. Nine frame components have generated stories and
  # docs whose prose is unwritten, and this job is red until they are done.
  docs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Every component has a finished doc
        run: npm run check:docs
