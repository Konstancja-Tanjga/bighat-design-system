<!--
  Material Symbols, from Google Fonts.

  The system standardises on one icon set and does not bundle it: the font is
  fetched by the consumer, and Storybook fetches it here so every example on
  this site shows the glyph a product would actually render rather than a
  placeholder square.

  `opsz 20..48` and the three style axes come down in one variable file, so a
  filled icon and an outlined one at two weights cost one request between them.
  `block` rather than `swap`: a ligature that has not loaded renders as the
  word "settings" across the toolbar, which is worse than a moment of nothing.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
/>

<!--
  The Article template is shown under World of Raptors' theme, which sets its
  headings in Poltawski Nowy and its reading text in Newsreader. Loaded here,
  for Storybook only: the package does not ship or fetch fonts.
-->
<link

  href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Poltawski+Nowy:wght@600&display=swap"
